id: org.chessmd.chessmd
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: start.sh

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri

modules:
  - name: Stockfish
    buildsystem: simple
    subdir: src
    build-commands:
      - cp ../nn-1c0000000000.nnue .
      - cp ../nn-37f18f62d772.nnue .
      - if [ ${FLATPAK_ARCH} == "aarch64" ]; then make build -j${FLATPAK_BUILDER_N_JOBS} ARCH=armv8; else make build -j${FLATPAK_BUILDER_N_JOBS}; fi
      - install -Dm755 stockfish /app/engine/stockfish
    sources:
      - type: archive
        url: https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_17.1.tar.gz
        sha256: 0cfd9396438798cc68f5c0d5fa0bb458bb8ffff7de06add841aaeace86bec1f1
      - type: file
        url: https://tests.stockfishchess.org/api/nn/nn-1c0000000000.nnue
        sha256: 1c0000000000a67d629999d932d0c373f7450ce43cd12d0562868f4eaf9ae2ad
      - type: file
        url: https://tests.stockfishchess.org/api/nn/nn-37f18f62d772.nnue
        sha256: 37f18f62d772f3107e1d6aaca3898c130c3c86f2ab63e6555fbbca20635a899d

  - name: chessmd-opening
    buildsystem: simple
    build-commands:
      - install -Dm755 start.sh /app/bin/start.sh
      - install -D opening/openings.bin /app/opening/openings.bin
      - install -D opening/openings.headers /app/opening/openings.headers
    sources:
      - type: file
        path: start.sh
      - type: archive
        url: https://github.com/ChessMD/ChessMD/releases/download/v1.1/ChessMD_portable.zip
        sha256: c1dbcb0e2ed646a67fae9774df06a830cf339ab26c04210aec19b65219f5a8ef 

  - name: ChessMD
    buildsystem: cmake-ninja
    no-make-install: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    build-commands:
      - install -Dm755 ChessMD /app/bin/ChessMD
      - install -D desktop/flathub/chessmd.metainfo.xml /app/share/metainfo/org.chessmd.chessmd.metainfo.xml
      - install -D desktop/flathub/chessmd.desktop /app/share/applications/org.chessmd.chessmd.desktop
      - install -D desktop/flathub/chessmd.svg /app/share/icons/hicolor/scalable/apps/org.chessmd.chessmd.svg
    sources:
      - type: archive
        url: https://github.com/ChessMD/ChessMD/archive/refs/tags/v1.1.1.tar.gz
        sha256: c392a802dbc094c8e67d4027f7674982ad44557cd54570c130c9aa5aaa042393 
      - type: patch
        path: fix-build-errors.patch
